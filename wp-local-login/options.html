<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WP Local Login</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px; margin: 32px auto; padding: 0 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { margin-top: 0; opacity: .7; }
  fieldset { border: 1px solid rgba(128,128,128,.4); border-radius: 6px; margin: 0 0 20px; padding: 14px 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; margin: 10px 0 4px; font-weight: 500; }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 7px 9px;
    border: 1px solid rgba(128,128,128,.5); border-radius: 4px;
    background: transparent; color: inherit; font: inherit;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .row input { width: 100%; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0; }
  .check input { margin-top: 3px; }
  .check span { font-weight: 400; }
  button { font: inherit; padding: 7px 14px; border-radius: 4px; border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: #2271b1; border-color: #135e96; color: #fff; }
  .warn { font-size: 12px; opacity: .75; border-left: 3px solid #d63638; padding-left: 10px; }
  #status { margin-left: 12px; color: #008a20; font-size: 13px; }
</style>
</head>
<body>
  <h1>WP Local Login</h1>
  <p class="sub">Only runs on <code>*.localhost</code>.</p>

  <fieldset>
    <legend>Default credentials</legend>
    <label for="defaultUser">Username</label>
    <input type="text" id="defaultUser" autocomplete="off" spellcheck="false">
    <label for="defaultPass">Password</label>
    <input type="password" id="defaultPass" autocomplete="off">
  </fieldset>

  <fieldset>
    <legend>Per-site overrides</legend>
    <div class="row"><strong>Hostname</strong><strong>Username</strong><strong>Password</strong><span></span></div>
    <div id="overrides"></div>
    <button type="button" id="addRow">Add site</button>
  </fieldset>

  <fieldset>
    <legend>Behaviour</legend>
    <label class="check"><input type="checkbox" id="enabled"><span>Enabled</span></label>
    <label class="check"><input type="checkbox" id="autoLogin"><span>Log in automatically on page load<br><small>Skipped after a logout, after a failed attempt, and within 10s of the last try.</small></span></label>
  </fieldset>

  <button type="button" class="primary" id="save">Save</button>
  <span id="status"></span>

  <p class="warn">Stored unencrypted in extension storage. Dev passwords only &mdash; never reuse a password you use anywhere real.</p>

  <script src="options.js"></script>
</body>
</html>
